# Quick test configuration
data:
  data_dir: null
  test_size: 0.2
  val_size: 0.1

preprocessing:
  numerical_strategy: median
  categorical_strategy: most_frequent
  scale: true

model:
  feature_budget: 0.6
  use_feature_selection: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  uncertainty_weight: 0.1
  use_uncertainty_weighting: true
  n_estimators: 10  # Reduced for quick test
  learning_rate: 0.05
  max_depth: 3  # Reduced for quick test

training:
  random_state: 42
  log_level: INFO
